<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loop Control · 三种布局 Demo</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="demo.js"></script>
</head>
<body>
  <header class="demo-bar">
    <div class="demo-label"><span class="logo-mark" aria-hidden="true"></span><strong>布局对比</strong><span class="muted">独立 Demo</span></div>
    <div class="choices" id="layouts" role="group" aria-label="选择布局">
      <button data-layout="A">A 双栏检查</button><button data-layout="B">B 三栏工作台</button><button data-layout="C">C 总览与抽屉</button>
    </div>
    <span class="demo-note">仅预览，不写入生产单</span>
  </header>
  <div class="app-shell">
    <aside class="app-rail" aria-label="工作区导航">
      <span class="logo-mark" aria-hidden="true"></span><span class="rail-name">Loop Control</span>
      <span class="rail-current">▦ <span>工作台</span></span><span>▤ <span>生产单</span></span><span>♙ <span>账号</span></span>
      <span class="rail-bottom">◉ <span>OpenChatCut</span></span>
    </aside>
    <main>
      <div class="breadcrumb">← 返回工作区 <span>/</span> 生产单</div>
      <header class="production-header">
        <div><p class="eyebrow">日照金山</p><h1>乔迁送礼</h1></div>
        <div class="order-status"><span class="success">✓ 已交付</span><span class="muted">6 个镜头 · 29.67 秒</span></div>
      </header>
      <nav class="steps" aria-label="制作步骤">
        <span class="script-step"><span class="step-number done">✓</span>脚本确认</span>
        <button data-step="preparation"><span class="step-number">2</span>分镜台</button>
        <button data-step="editing"><span class="step-number">3</span>剪辑工作台</button>
        <button data-step="delivery"><span class="step-number done">✓</span>检查与交付</button>
      </nav>
      <div class="layout-explainer" id="layoutDescription"></div>
      <section class="work-surface" aria-label="生产内容">
        <header class="surface-heading"><h2 id="surfaceTitle">分镜台</h2><span id="surfaceMeta" class="muted"></span><span class="readonly">只读</span></header>
        <div id="content"></div>
      </section>
      <footer class="demo-footer"><span>三种布局共用同一批测试内容</span><button id="designNotes">查看本次调整</button></footer>
    </main>
  </div>
  <dialog id="detailDialog" aria-labelledby="dialogTitle" closedby="any">
    <header class="dialog-heading"><div><p id="dialogEyebrow" class="eyebrow"></p><h2 id="dialogTitle"></h2></div><form method="dialog"><button aria-label="关闭详情" autofocus class="icon-button">✕</button></form></header>
    <div id="dialogBody"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
