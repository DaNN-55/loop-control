*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button,select,input,textarea{border-radius:7px}button{color:inherit}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}::selection{background:#ccdaff;color:#17263e}input,textarea{caret-color:var(--blue)}*{scrollbar-width:thin;scrollbar-color:#bdcadd transparent}svg{width:18px;height:18px;flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}h1,h2,h3,p{margin:0}h1{font-size:26px;letter-spacing:-.025em;font-weight:650}h2{font-size:21px;letter-spacing:-.02em;font-weight:650}h3{font-size:14px;font-weight:650}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;gap:10px}.spacer{flex:1;min-width:0}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;border:1px solid var(--strong);background:var(--surface);font-size:13px;font-weight:550;white-space:nowrap}.btn:hover{background:var(--soft)}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.primary:hover{background:var(--blue-hover)}.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}.btn.quiet:hover{background:var(--bg);color:var(--ink)}.icon-btn{padding:7px;width:32px;height:32px}.rail{position:fixed;inset:0 auto 0 0;width:200px;background:var(--rail);color:#e8efff;display:flex;flex-direction:column;padding:25px 14px;z-index:2}.brand{font-size:20px;font-weight:650;display:flex;gap:10px;align-items:center;padding:2px 9px 30px;white-space:nowrap}.brand svg{width:27px;height:27px;stroke-width:2.5}.global-nav{display:grid;gap:7px}.global-link{display:flex;align-items:center;gap:11px;padding:11px 12px;font-size:14px;border-radius:7px;color:#e8efff;text-decoration:none}.global-link.active{background:#ffffff24;font-weight:650}.global-link.disabled{opacity:.7;cursor:default}.global-rule{height:1px;background:#ffffff21;margin:18px 10px}.rail-bottom{margin-top:auto;font-size:12px;padding:20px 12px 3px;opacity:.8}.shell{margin-left:200px;min-width:0}.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 30px;background:var(--soft);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.crumb{display:flex;align-items:center;gap:12px}.crumb svg{width:14px;height:14px}.demo-label{color:var(--muted);white-space:nowrap}.page{padding:25px 30px 30px;max-width:1800px;margin:auto}.page-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.workspace{display:grid;grid-template-columns:220px minmax(0,1fr);background:white;border:1px solid var(--line);border-radius:12px;min-height:calc(100vh -160px);overflow:clip}.local-nav{background:var(--soft);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;min-width:0}.account-picker{padding:0 6px 19px;margin-bottom:11px;border-bottom:1px solid var(--line)}.account-picker label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.account-picker select{width:100%;background:white;border:1px solid var(--strong);padding:9px 26px 9px 10px;font-weight:600;font-size:13px;min-width:0}.local-button{display:flex;align-items:center;gap:9px;min-height:38px;width:100%;padding:9px 12px;border:0;background:transparent;text-align:left;font-size:13px;border-radius:7px;min-width:0}.local-button:hover{background:#e9eef6}.local-button.active{background:var(--blue-soft);color:var(--blue);font-weight:650}.local-button .nav-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.local-button svg{width:17px;height:17px}.group-heading{display:flex;align-items:center;justify-content:space-between;margin:21px 8px 6px 12px;font-size:12px;color:var(--muted)}.main-nav{display:contents}.series-list{display:grid;gap:3px}.series-list .local-button{padding-left:16px}.series-list .local-button:before{content:"";width:5px;height:5px;border:1px solid currentColor;border-radius:50%;margin:0 4px;flex:none}.nav-settings{margin-top:auto;padding-top:30px}.editor{min-width:0;display:flex;flex-direction:column}.editor-heading{padding:25px 30px 21px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.editor-heading p{margin-top:6px;font-size:12px;color:var(--muted)}.version{font-size:12px;color:var(--muted);margin-right:4px;font-variant-numeric:tabular-nums}.form{flex:1;padding:0 30px}.field-row{display:grid;grid-template-columns:145px minmax(0,1fr);gap:24px;padding:23px 0;border-bottom:1px solid var(--line)}.field-row:last-child{border-bottom:0}.field-label{padding-top:8px}.field-label p{font-size:12px;color:var(--muted);margin-top:4px}.field-body{max-width:780px;min-width:0}.field-body textarea,.field-body input,.dialog-input{width:100%;padding:10px 12px;border:1px solid var(--strong);background:white;color:var(--ink);font-size:13px;line-height:1.7;min-width:0}.field-body textarea{display:block;resize:vertical;min-height:76px}.field-body textarea.large{min-height:94px}.field-body textarea:disabled{background:var(--soft);color:var(--muted);opacity:1}.field-body textarea:hover:not(:disabled),.field-body input:hover{border-color:#92a8ca}.inheritance{display:flex;align-items:center;gap:7px;margin:0 0 9px;font-size:12px;color:var(--muted);width:max-content;max-width:100%;cursor:pointer}.inheritance input{width:14px;height:14px;accent-color:var(--blue);margin:0}.reference{margin-top:9px;font-size:12px;color:var(--muted);line-height:1.7}.reference summary{cursor:pointer;width:max-content}.reference p{margin-top:5px;white-space:pre-wrap}.savebar{padding:16px 30px;border-top:1px solid var(--line);background:var(--soft);display:flex;align-items:center;gap:10px;position:sticky;bottom:0;z-index:1;min-height:70px}.save-status{font-size:1 @media(min-width:1600px){.field-row{grid-template-columns:165px minmax(0,1fr);gap:30px}.editor-heading,.savebar{padding-left:36px;padding-right:36px}.form{padding:0 36px}}
@media(max-width:1100px){.rail{width:64px;padding:24px 9px}.brand{padding:0 8px 26px}.brand span,.global-link span,.rail-bottom{display:none}.global-link{padding:12px;justify-content:center}.global-rule{margin:16px 4px}.shell{margin-left:64px}.page{padding:22px}.topbar{padding:0 22px}.workspace{grid-template-columns:200px minmax(0,1fr)}.editor-heading{padding:22px}.form{padding:0 22px}.field-row{grid-template-columns:115px minmax(0,1fr);gap:18px}.savebar{padding:15px 22px;flex-wrap:wrap}.scope-note{width:100%;margin-left:0}.toast{left:calc(50% + 32px)}}
@media(max-width:720px){.rail{display:none}.shell{margin-left:0}.topbar{height:46px;padding:0 16px}.crumb span:first-child,.crumb svg{display:none}.demo-label{font-size:12px}.page{padding:19px 14px}.page-heading{margin-bottom:15px}h1{font-size:26px}.workspace{display:block;min-height:calc(100vh -140px)}.local-nav{border-right:0;border-bottom:1px solid var(--line);padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.account-picker{grid-column:1/-1;padding:0;margin:0;border:0;display:flex;align-items:center;gap:12px}.account-picker label{white-space:nowrap;margin:0}.account-picker select{flex:1}.main-nav{min-width:0;display:flex;align-items:center;gap:6px;grid-column:1/-1}.main-nav>.local-button{width:auto;flex:none;padding:8px}.group-heading{margin:0;flex:none}.group-heading>span{display:none}.series-list{display:flex;overflow-x:auto;min-width:0;gap:4px;flex:1}.series-list .local-button{width:auto;flex:none;max-width:170px;padding:8px}.series-list .local-button:before{display:none}.nav-settings{padding:0;margin:0;flex:none}.nav-settings .local-button{width:34px;padding:8px}.nav-settings .nav-name{display:none}.editor-heading{padding:20px 18px;gap:10px}h2{font-size:18px}.editor-heading p{font-size:12px}.editor-heading .btn{padding:6px}.editor-heading .version{display:none}.form{padding:0 18px}.field-row{display:block;padding:20px 0}.field-label{padding:0;margin-bottom:10px;display:flex;align-items:baseline;gap:10px}.field-label p{margin:0}.field-body textarea{min-height:83px}.savebar{padding:14px 18px;gap:8px;position:static}.savebar .spacer{display:none}.savebar>.btn{margin-left:auto}.savebar>.btn.primary{margin-left:0}.scope-note{font-size:12px}.toast{left:50%;width:max-content;text-align:center}.empty-series{padding:0 8px;white-space:nowrap}.history-item{gap:10px}}
</style>

<body>
<aside class="rail" aria-label="主导航">
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14a9 9 0 1 0-6 6M20 14v6h-6"/></svg><span>Loop Control</span></div>
  <nav class="global-nav"><span class="global-link disabled" title="Demo 仅展示账号工作区"><i data-icon="grid"></i><span>工作台</span></span><span class="global-link disabled" title="Demo 仅展示账号工作区"><i data-icon="film"></i><span>生产单</span></span><div class="global-rule"></div><span class="global-link active" aria-current="page"><i data-icon="users"></i><span>账号</span></span><span class="global-link disabled" title="Demo 仅展示账号工作区"><i data-icon="plug"></i><span>连接配置</span></span><span class="global-link disabled" title="Demo 仅展示账号工作区"><i data-icon="archive"></i><span>历史资料</span></span></nav>
  <div class="rail-bottom">Loop Control · 布局预览</div>
</aside>
<div class="shell">
  <header class="topbar"><div class="crumb"><span>个人工作区</span><i data-icon="chevron"></i><strong>账号</strong></div><span class="demo-label">交互 Demo · 示例数据，仅当前页面有效</span></header>
  <main class="page"><div class="page-heading"><h1>账号</h1><button class="btn" id="new-account"><i data-icon="plus"></i>新建账号</button></div>
    <section class="workspace" aria-label="账号工作区">
      <nav class="local-nav" aria-label="账号内容导航">
        <div class="account-picker"><label for="account">当前账号</label><select id="account"></select></div>
        <div class="main-nav" id="main-nav"><button class="local-button" data-view="common"><i data-icon="sliders"></i><span class="nav-name">通用规则</span></button>
        <div class="group-heading"><span>系列</span><button class="btn quiet icon-btn" id="new-series" aria-label="新建系列" title="新建系列"><i data-icon="plus"></i></button></div>
        <div class="series-list" id="series-list"></div>
        <div class="nav-settings"><button class="local-button" data-view="settings" title="账号设置"><i data-icon="settings"></i><span class="nav-name">账号设置</span></button></div></div>
      </nav>
      <div class="editor" id="editor"></div>
    </section>
  </main>
</div>
<div class="toast" role="status" id="toast" hidden></div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<script>
const paths={grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',plug:'<path d="M8 3v5M16 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/>',archive:'<rect x="3" y="3" width="18" height="5" rx="1"/><path d="M5 8v12h14V8M10 12h4"/>',chevron:'<path d="m9 5 7 7-7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',sliders:'<path d="M4 7h8M16 7h4M4 17h4M12 17h8"/><circle cx="14" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',settings:'<path d="m9 3-1 3-3 1v4l2 1v3l-1 2 3 3 3-1 3 1 3-3-1-2v-3l2-1V7l-3-1-1-3z"/><circle cx="12" cy="12" r="3"/>',history:'<path d="M3 11a9 9 0 1 1 3 8M3 4v7h7M12 7v5l3 2"/>',check:'<path d="m5 12 4 4L19 6"/>',x:'<path d="m6 6 12 12M18 6 6 18"/>',folder:'<path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11H3z"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]||''}</svg>`;
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const fields=[['position','账号定位','内容与受众'],['tone','表达风格','语气与叙事方式'],['boundaries','内容边界','应该坚持或避免的内容'],['visual','视觉偏好','跨系列沿用的画面方向']];
const common={position:'以日照金山装饰画为核心，分享家居与店铺的空间布置，让用户看清作品细节和实际悬挂效果。',tone:'口语化、简洁、具体。先展示使用场景，再介绍作品；少用夸张形容，不制造焦虑。',boundaries:'不承诺招财、转运等实际功效；不虚构用户经历、销量和购买反馈。',visual:'自然光、真实空间，突出画作的色彩与材质。画面干净，避免过度滤镜。'};
const makeSeries=(id,name,overrides={})=>({id,name,overrides,version:1,history:[{version:1,note:'创建系列规则'}]});
const accounts=[{id:'sun',name:'日照金山样片',directory:'/Volumes/创作资料/日照金山',common:{...common},version:3,history:[{version:3,note:'补充内容边界与视觉偏好'},{version:2,note:'调整表达风格'},{version:1,note:'创建账号通用规则'}],series:[makeSeries('product','产品展示',{position:'展示日照金山装饰画的细节、尺寸与悬挂方式，每期聚焦一个明确卖点。',visual:'以画作特写和空间全景交替呈现，细节镜头停留更久。'}),makeSeries('space','空间搭配',{position:'围绕客厅、玄关与店铺场景，分享装饰画与空间的搭配思路。'}),makeSeries('detail','材质与细节')]},{id:'tools',name:'工具使用分享',directory:'',common:{position:'面向普通创作者，分享常用工具的实际使用方法与操作体验。',tone:'直接说明问题，用具体步骤和实际演示表达。',boundaries:'标明试用条件与限制，不夸大工具能力。',visual:'优先展示真实操作过程，关键信息保持清晰可读。'},version:1,history:[{version:1,note:'创建账号通用规则'}],series:[makeSeries('tutorial','上手教程',{position:'每期解决一个具体操作问题，让用户可以跟着做。'})]}];
let accountId='sun',view='common',draft,saved,dirty=false,toastTimer,returnFocus;
const current=()=>accounts.find(a=>a.id===accountId);
const series=()=>current().series.find(s=>s.id===view);
const clone=value=>JSON.parse(JSON.stringify(value));
function notify(message){clearTimeout(toastTimer);const el=document.querySelector('#toast');el.textContent=message;el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,3000)}
function decorate(root=document){root.querySelectorAll('[data-icon]').forEach(el=>{el.outerHTML=icon(el.dataset.icon)})}
function navigation(){const a=current();document.querySelector('#account').innerHTML=accounts.map(item=>`<option value="${esc(item.id)}" ${item.id===accountId?'selected':''}>${esc(item.name)}</option>`).join('');document.querySelector('#series-list').innerHTML=a.series.length?a.series.map(s=>`<button class="local-button ${view===s.id?'active':''}" data-view="${esc(s.id)}" ${view===s.id?'aria-current="page"':''} title="${esc(s.name)}"><span class="nav-name">${esc(s.name)}</span></button>`).join(''):'<p class="empty-series">暂无系列</p>';document.querySelectorAll('[data-view]').forEach(button=>{button.classList.toggle('active',button.dataset.view===view);if(button.dataset.view===view)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')})}
function load(){const a=current();draft=view==='common'?clone(a.common):view==='settings'?{name:a.name,directory:a.directory}:{name:series().name,overrides:clone(series().overrides)};saved=clone(draft);dirty=false;navigation();render()}
function field(key,title,hint){const s=series(),inherited=s&&!Object.hasOwn(draft.overrides,key);const value=view==='common'?draft[key]:inherited?current().common[key]:draft.overrides[key];return `<div class="field-row"><div class="field-label"><h3><label for="field-${key}">${title}</label></h3><p>${hint}</p></div><div class="field-body">${s?`<label class="inheritance"><input type="checkbox" data-inherit="${key}" ${inherited?'checked':''}>沿用账号通用规则</label>`:''}<textarea id="field-${key}" data-field="${key}" ${key==='position'?'class="large"':''} ${inherited?'disabled':''} rows="${key==='position'?3:2}">${esc(value)}</textarea>${s&&!inherited?`<details class="reference"><summary>查看账号规则</summary><p>${esc(current().common[key])}</p></details>`:''}</div></div>`}
function render(){const a=current(),s=series(),settings=view==='settings',title=settings?'账号设置':s?s.name:'通用规则';document.querySelector('#editor').innerHTML=`<div class="editor-heading"><div><h2>${esc(title)}</h2><p>${esc(a.name)}${settings?'':s?' · 系列规则，仅覆盖单独设置的内容':' · 适用于此账号下的所有系列'}</p></div>${settings?'':`<div class="row"><span class="version">v${s?s.version:a.version}</span><button class="btn quiet" id="history">${icon('history')}<span>历史版本</span></button></div>`}</div><form class="form pane-content" id="editor-form">${settings?settingsFields():`${s?`<div class="field-row"><div class="field-label"><h3><label for="series-name">系列名称</label></h3></div><div class="field-body"><input id="series-name" data-property="name" required maxlength="60" value="${esc(draft.name)}"></div></div>`:''}${fields.map(args=>field(...args)).join('')}`}</form><footer class="savebar"><span class="save-status" id="save-status">${icon('check')}已保存</span><span class="spacer"></span><button class="btn" id="discard" disabled>撤销修改</button><button class="btn primary" id="save" disabled>${settings?'保存设置':s?'保存系列规则':'保存通用规则'}</button><span class="scope-note">${settings?'账号资料与目录独立保存':'仅影响新生产单'} <span title="已有生产单继续使用创建时的规则版本。">${settings?'':icon('history')}</span></span></footer>`;updateStatus()}
function settingsFields(){return `<div class="field-row"><div class="field-label"><h3><label for="account-name">账号名称</label></h3></div><div class="field-body"><input id="account-name" data-property="name" maxlength="60" required value="${esc(draft.name)}"></div></div><div class="field-row"><div class="field-label"><h3><label for="directory">账号专属目录</label></h3><p>生产单与素材的归属目录</p></div><div class="field-body"><input id="directory" data-property="directory" value="${esc(draft.directory)}" placeholder="填写账号专属文件夹路径"><p class="inline-note">${draft.directory?'该账号的生产单与素材统一归入此目录。':'尚未设置，请为该账号指定专属文件夹。'}</p><p class="inline-note">本 Demo 仅预览路径设置，不会创建目录或移动文件。</p></div></div>`}
function updateStatus(){dirty=JSON.stringify(draft)!==JSON.stringify(saved);const el=document.querySelector('#save-status');el.classList.toggle('dirty',dirty);el.innerHTML=dirty?'有未保存的修改':`${icon('check')}已保存`;document.querySelector('#discard').disabled=!dirty;document.querySelector('#save').disabled=!dirty}
function showDialog(title,body,actions){returnFocus=document.activeElement;const el=document.querySelector('#dialog');el.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${esc(title)}</h2><button class="btn quiet icon-btn" data-close aria-label="关闭">${icon('x')}</button></div><div class="dialog-body">${body}</div><div class="dialog-foot">${actions}</div>`;el.showModal()}
function closeDialog(){document.querySelector('#dialog').close();if(returnFocus?.isConnected)returnFocus.focus()}
function guard(action){if(!dirty){action();return}showDialog('离开前保存修改？','<p>当前内容尚未保存，切换后将丢弃这些修改。</p>','<button class="btn" data-close>继续编辑</button><button class="btn" id="leave-discard">丢弃并切换</button><button class="btn primary" id="leave-save">保存并切换</button>');document.querySelector('#leave-discard').onclick=()=>{closeDialog();action()};document.querySelector('#leave-save').onclick=()=>{if(save()){closeDialog();action()}}}
function save(){const a=current(),s=series();const name=draft.name?.trim();if(view!=='common'&&!name){notify('请填写名称后再保存');document.querySelector('[data-property="name"]').focus();return false}if(view==='settings'){if(accounts.some(item=>item.id!==a.id&&item.name===name)){notify('已有同名账号，请换一个名称');return false}a.name=name;a.directory=draft.directory.trim();draft={name:a.name,directory:a.directory}}else if(s){if(a.series.some(item=>item.id!==s.id&&item.name===name)){notify('已有同名系列，请换一个名称');return false}s.name=name;s.overrides=clone(draft.overrides);s.version++;s.history.unshift({version:s.version,note:'更新系列规则'});draft.name=name}else{a.common=clone(draft);a.version++;a.history.unshift({version:a.version,note:'更新账号通用规则'})}saved=clone(draft);dirty=false;navigation();render();notify('已保存在本次预览中');return true}
function create(kind){guard(()=>{const isAccount=kind==='account';showDialog(isAccount?'新建账号':'新建系列',`<label for="new-name">${isAccount?'账号名称':'系列名称'}</label><input class="dialog-input" id="new-name" maxlength="60" autocomplete="off"><p class="inline-note">${isAccount?'新账号拥有独立的规则、系列和资产目录。':'新系列默认沿用账号通用规则，可逐项单独设置。'}</p><p class="error" id="new-error" role="alert"></p>`,'<button class="btn" data-close>取消</button><button class="btn primary" id="create-confirm">创建</button>');const submit=()=>{const name=document.querySelector('#new-name').value.trim(),items=isAccount?accounts:current().series;if(!name||items.some(item=>item.name===name)){document.querySelector('#new-error').textContent=!name?'请填写名称。':'名称已存在，请使用其他名称。';document.querySelector('#new-name').focus();return}const id=`demo-${Date.now()}`;if(isAccount){accounts.push({id,name,directory:'',common:{position:'',tone:'',boundaries:'',visual:''},version:1,history:[{version:1,note:'创建账号通用规则'}],series:[]});accountId=id;view='common'}else{current().series.push(makeSeries(id,name));view=id}closeDialog();load();notify(isAccount?'示例账号已创建':'示例系列已创建')};document.querySelector('#create-confirm').onclick=submit;document.querySelector('#new-name').onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();submit()}}})}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.hasAttribute('data-view'))guard(()=>{view=button.dataset.view;load()});else if(button.hasAttribute('data-close'))closeDialog();else if(button.id==='save')save();else if(button.id==='discard'){draft=clone(saved);dirty=false;render()}else if(button.id==='new-series')create('series');else if(button.id==='new-account')create('account');else if(button.id==='history'){const target=series()||current();showDialog(`${series()?'系列':'通用规则'}历史版本`,target.history.map((item,index)=>`<div class="history-item"><strong>v${item.version}</strong><div><strong>${esc(item.note)}</strong><p>${index===0?'当前版本':'保留历史版本，供已有生产单引用'}</p></div></div>`).join(''),'<button class="btn" data-close>关闭</button>')}});
document.querySelector('#account').onchange=event=>{const next=event.target.value;event.target.value=accountId;guard(()=>{accountId=next;view='common';load()})};
document.querySelector('#editor').addEventListener('input',event=>{const key=event.target.dataset.field,property=event.target.dataset.property;if(key){if(view==='common')draft[key]=event.target.value;else draft.overrides[key]=event.target.value}else if(property)draft[property]=event.target.value;updateStatus()});
document.querySelector('#editor').addEventListener('change',event=>{const key=event.target.dataset.inherit;if(!key)return;if(event.target.checked)delete draft.overrides[key];else draft.overrides[key]=current().common[key];render();document.querySelector(`[data-inherit="${key}"]`).focus()});
document.querySelector('#editor').addEventListener('submit',event=>{event.preventDefault();if(dirty)save()});
document.querySelector('#dialog').addEventListener('cancel',event=>{event.preventDefault();closeDialog()});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});
decorate();load();
</script>
</body>
</html>
