<style>
:root{font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#17263e;background:#eef2f8;--bg:#eef2f8;--white:#fff;--soft:#f7f9fc;--ink:#17263e;--muted:#596b83;--line:#d8e1ee;--strong:#bdcadd;--blue:#365fe0;--blue-soft:#eaf0ff;--green:#167556}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--strong) transparent}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button,input,select,textarea{border-radius:7px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:3px}::selection{background:#ccdaff;color:var(--ink)}input,textarea{caret-color:var(--blue)}h1,h2,h3,p{margin:0}svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:none}h1{font-size:21px;font-weight:650;letter-spacing:-.02em}h2{font-size:15px;font-weight:650}h3{font-size:14px;font-weight:650}.muted{color:var(--muted)}.small{font-size:12px}.rail{position:fixed;inset:0 auto 0 0;width:64px;background:#173e8f;color:#e8efff;display:flex;align-items:center;flex-direction:column;padding:23px 9px;gap:18px;z-index:3}.logo{width:25px;height:25px;margin-bottom:19px}.rail-item{width:42px;height:42px;display:grid;place-items:center;border-radius:7px}.rail-item.active{background:#ffffff24}.rail-bottom{margin-top:auto}.app{margin-left:64px}.topbar{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 28px;background:var(--soft);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.topbar .row{gap:10px}.row{display:flex;align-items:center;gap:8px}.spacer{flex:1}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:6px 12px;background:white;border:1px solid var(--strong);font-size:13px;font-weight:550;white-space:nowrap}.btn:hover:not(:disabled){background:var(--soft)}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.primary:hover:not(:disabled){background:#254fc9}.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}.btn.quiet:hover:not(:disabled){background:var(--bg)}main{padding:23px 28px 30px;max-width:1800px;margin:auto}.heading{margin-bottom:16px}.heading p{margin-top:5px;font-size:12px;color:var(--muted)}.steps{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:0 0 16px;padding:0;list-style:none;font-size:13px;color:var(--muted);overflow-x:auto}.steps li{padding:9px 0 13px;white-space:nowrap;display:flex;align-items:center;gap:8px}.step-num{display:grid;place-items:center;width:21px;height:21px;border:1px solid var(--strong);border-radius:50%;font-size:12px}.steps .active{color:var(--blue);font-weight:600;border-bottom:2px solid var(--blue)}.active .step-num{background:var(--blue);color:white;border-color:var(--blue)}.workspace{background:white;border:1px solid var(--line);border-radius:12px;overflow:clip}.workspace-heading{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}.matched{font-size:12px;color:var(--green);background:#e9f5ef;padding:2px 6px;border-radius:5px}.workspace-columns{display:grid;grid-template-columns:minmax(380px,1.15fr) minmax(390px,1fr);align-items:stretch}.shot-pane{display:flex;flex-direction:column;min-width:0}.table-caption{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;font-size:12px}.table-caption strong{font-size:13px}.table-caption span{color:var(--muted)}.table-scroll{min-width:0;flex:1;overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px;table-layout:fixed}th{background:var(--soft);padding:8px 12px;text-align:left;font-weight:500;font-size:12px;color:var(--muted)}th:first-child{width:64px}th:nth-child(3){width:62px}th:last-child{width:92px}td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}tr[aria-selected=true]{background:var(--blue-soft)}td:first-child{font-weight:650}tr[aria-selected=true] td:first-child{color:var(--blue)}.shot-button{background:transparent;border:0;padding:0;text-align:left;font:inherit;line-height:1.65;width:100%;min-height:28px}.shot-status{font-size:12px;color:var(--muted);white-space:nowrap}.shot-status.adopted{color:var(--green)}.table-footer{padding:13px 14px;background:var(--soft);color:var(--muted);border-top:1px solid var(--line);font-size:12px}.detail{border-left:1px solid var(--line);background:var(--soft);min-width:0}.detail-heading{display:flex;align-items:center;gap:12px;padding:11px 16px;background:white;border-bottom:1px solid var(--line);min-height:48px}.detail-heading span{font-size:12px;color:var(--muted)}.kind-tabs{display:flex;gap:5px;padding:0 0 16px}.kind-tabs button{background:transparent;border:0;padding:6px 12px;min-height:32px;color:var(--muted);font-size:13px}.kind-tabs button[aria-selected=true]{color:var(--blue);background:var(--blue-soft);font-weight:600}.detail-body{padding:16px}.generation-form{border:0;margin:0;padding:0;min-width:0;display:grid;gap:12px}.generation-form label{display:grid;gap:6px;font-size:12px;min-width:0}.generation-form input,.generation-form select,.generation-form textarea{width:100%;border:1px solid var(--strong);background:white;padding:7px 9px;min-height:34px;font-size:13px;min-width:0}.generation-form textarea{resize:vertical;min-height:80px;line-height:1.6}.settings{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 76px;gap:8px}.generate{width:100%;margin-top:2px}.current-state{display:flex;align-items:center;gap:6px;padding:11px 0;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);overflow-wrap:anywhere}.current-state svg{width:15px;height:15px}.current-state.adopted{color:var(--green)}.results{padding-top:17px;scroll-margin-top:20px}.results-heading{display:flex;gap:10px;align-items:center;margin-bottom:12px}.results-heading h3{font-size:14px}.result-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.results-heading>span:last-child{margin-left:auto;font-size:12px;color:var(--muted)}.empty{min-height:158px;display:grid;place-content:center;justify-items:center;gap:9px;padding:22px 12px;background:white;border:1px dashed var(--strong);border-radius:7px;text-align:center;color:var(--muted);font-size:12px}.empty svg{width:25px;height:25px}.empty strong{color:var(--ink);font-size:13px;font-weight:550}.pending{display:flex;align-items:center;gap:9px;color:var(--blue)}.pending svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.candidate-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.candidate{background:white;border:1px solid var(--line);border-radius:7px;padding:0;overflow:hidden;text-align:left;min-width:0}.candidate:hover{border-color:var(--strong)}.candidate[aria-pressed=true]{border-color:var(--blue);outline:1px solid var(--blue);outline-offset:-2px}.placeholder{display:grid;place-content:center;justify-items:center;gap:7px;background:#e9eef5;color:var(--muted);height:116px;font-size:12px}.placeholder[data-variant="1"]{background:#e6edf7}.placeholder[data-variant="2"]{background:#eeeae4}.placeholder[data-variant="3"]{background:#e6eeeb}.placeholder svg{width:25px;height:25px}.candidate-info{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:8px 10px;font-size:12px}.candidate-info>span:first-child{font-weight:600}.candidate-info>span:last-child{color:var(--muted);font-size:12px;white-space:nowrap}.candidate-info .used{color:var(--green)!important}.selection-preview{margin-top:14px;border-top:1px solid var(--line);padding-top:13px}.selection-title{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px;font-size:12px}.selection-title strong{font-size:13px;font-weight:600}.selection-preview .placeholder{height:190px;border-radius:6px}.selection-actions{display:flex;align-items:center;gap:12px;margin-top:11px}.selection-actions p{font-size:12px;color:var(--muted);flex:1}.selection-actions .btn{margin-left:auto}.status-line{font-size:12px;color:var(--muted);margin-top:10px;min-height:18px}.status-line:empty{display:none}.results-arrived{animation:arrive .7s ease-out}@keyframes arrive{from{background:#eaf0ff}to{background:transparent}}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){.results-arrived,.pending svg{animation:none}}@media(max-width:950px){main{padding:20px 18px}.topbar{padding-inline:18px}.workspace-columns{grid-template-columns:minmax(300px,1fr) minmax(350px,1fr)}.steps{gap:20px}td{padding:10px}.settings{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.settings>label:first-child{grid-column:1/-1}}
@media(max-width:760px){.rail{display:none}.app{margin:0}.topbar{padding:10px 14px;align-items:center;flex-wrap:wrap}.topbar .row{gap:8px}.topbar>span{font-size:12px}main{padding:18px 14px}.workspace-columns{grid-template-columns:minmax(0,1fr)}.table-scroll{max-height:275px}.detail{border-left:0;border-top:1px solid var(--line)}.detail-body{padding:14px}.heading{margin-bottom:12px}h1{font-size:18px}.steps{font-size:12px;gap:18px}.step-num{width:19px;height:19px}.workspace-heading{padding:12px 14px}.settings{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 64px}.settings>label:first-child{grid-column:auto}.selection-actions{align-items:flex-start;flex-wrap:wrap}.selection-actions .btn{width:100%}.placeholder{height:104px}.selection-preview .placeholder{height:180px}.table-caption span{font-size:12px}th:first-child{width:54px}th:nth-child(3){width:54px}th:last-child{width:78px}.btn{padding-inline:10px}}

/* Generated results stay above one continuous generation form. */
.results{padding-top:0}.results-gallery{display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;align-items:start}
.thumbnail-rail{height:260px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:8px;padding:1px 4px 1px 1px;scrollbar-gutter:stable}
.thumbnail-rail .candidate{flex:none;width:100%}.thumbnail-rail .placeholder{height:66px}.thumbnail-rail .placeholder span{display:none}.thumbnail-rail .placeholder svg{width:21px;height:21px}
.thumbnail-rail .candidate-info{padding:5px 4px;justify-content:center;gap:5px;font-size:12px}.thumbnail-rail .candidate-info svg{width:12px;height:12px;color:var(--green)}
.rail-empty{height:260px;display:grid;place-content:center;justify-items:center;gap:6px;border:1px dashed var(--strong);border-radius:7px;color:var(--muted);font-size:12px}
.preview-column{min-width:0}.selection-preview{margin:0;padding:0;border:0}.selection-preview .placeholder,.preview-column>.empty{height:260px;min-height:260px}.selection-title{margin-top:8px;margin-bottom:0}.selection-actions{min-height:34px;margin-top:8px}.selection-actions p{font-size:12px}
.current-state{border:0;padding:10px 0 0}.generation-form{container-type:inline-size;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.generation-form h3{font-size:14px}.generation-settings{grid-template-columns:minmax(0,1.2fr) minmax(0,.7fr) minmax(0,.8fr) minmax(0,1.3fr)}.generation-settings>label:first-child{grid-column:auto}
@container(max-width:420px){.generation-settings{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.results-gallery{grid-template-columns:64px minmax(0,1fr);gap:8px}.thumbnail-rail .placeholder{height:60px}.selection-actions{display:flex;flex-wrap:wrap}.selection-actions .btn{width:100%;margin-left:0}.generation-settings{grid-template-columns:repeat(2,minmax(0,1fr))}}

.selection-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:8px;min-width:0}.selection-footer p{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.selection-footer strong{font-size:12px;font-weight:600}.selection-footer .btn{flex:none;min-height:32px;padding-block:5px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>

<body>
<aside class="rail" aria-label="主导航示意"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14a9 9 0 1 0-6 6M20 14v6h-6"/></svg><span class="rail-item" data-icon="grid"></span><span class="rail-item active" data-icon="film"></span><span class="rail-item" data-icon="users"></span><span class="rail-item rail-bottom" data-icon="panel"></span></aside>
<div class="app">
 <header class="topbar"><div class="row"><strong>Loop Control</strong><span>生成结果与采用 · 占位 Demo</span></div><div class="row"><span>仅页面演示，不调用服务</span><button class="btn quiet" id="reset">重置演示</button></div></header>
 <main>
  <div class="heading"><h1>空间展示样片 · 示例生产单</h1><p>所有文字、模型与画面均为占位示例</p></div>
  <ol class="steps" aria-label="制作步骤示意"><li><span class="step-num">1</span>脚本确认</li><li class="active" aria-current="step"><span class="step-num">2</span>素材准备与匹配</li><li><span class="step-num">3</span>剪辑工作台</li><li><span class="step-num">4</span>检查与交付</li></ol>
  <section class="workspace" aria-label="素材准备 Demo">
   <header class="workspace-heading"><h2>素材匹配</h2><span class="matched" id="matched">0 / 6 画面就绪</span></header>
   <div class="workspace-columns">
    <section class="shot-pane" aria-label="镜头列表"><div class="table-caption"><strong>镜头</strong><span>选择一行，查看该镜头的生成结果</span></div><div class="table-scroll"><table aria-label="分镜表"><thead><tr><th>镜头</th><th>脚本与素材</th><th>时长</th><th>画面</th></tr></thead><tbody id="shots"></tbody></table></div><footer class="table-footer">6 个镜头 · 选择候选后，明确采用才改变镜头画面</footer></section>
    <section class="detail" aria-label="画面生成与选择"><header class="detail-heading"><h2 id="target">S01 · 画面</h2><span class="spacer"></span><span>占位交互</span></header><div class="detail-body">
      <div class="kind-tabs" role="tablist" aria-label="画面类型"><button role="tab" id="image-tab" aria-controls="generation-panel" aria-selected="true" data-kind="image">图片</button><button role="tab" id="video-tab" aria-controls="generation-panel" aria-selected="false" data-kind="video">视频</button></div>
      <div role="tabpanel" id="generation-panel" aria-labelledby="image-tab">
       <section class="results" id="results" aria-labelledby="results-title"><header class="results-heading"><h3 id="results-title" tabindex="-1">生成结果</h3><span class="result-count" id="result-count">0 个</span><span id="result-hint">生成后在此选择</span></header><div id="results-content"></div><p class="sr-only" id="status" role="status" aria-live="polite"></p></section>
       <fieldset class="generation-form" id="form"><h3>AI 生成</h3><label for="model">连接与模型（占位）<select id="model"><option>示例模型 A</option><option>示例模型 B</option></select></label><label for="reference">参考图（占位，可选）<select id="reference"><option value="">不使用参考图</option><option>参考图占位 A</option><option>参考图占位 B</option></select></label><label for="prompt">图片提示词<textarea id="prompt" rows="3" maxlength="800" placeholder="填写这次生成的画面描述"></textarea></label><div class="settings generation-settings"><label for="ratio">画面比例<select id="ratio"><option>竖屏 9:16</option><option>横屏 16:9</option><option>方形 1:1</option></select></label><label for="count">数量<select id="count"><option value="1">1 个</option><option value="2">2 个</option><option value="4">4 个</option></select></label><label for="quality">质量<select id="quality"><option>自动</option><option>标准</option><option>高</option></select></label><label for="amount">费用预留（元）<input id="amount" type="number" min="0.01" step="0.01" value="1.00"></label></div><button class="btn primary generate" id="generate">生成图片</button></fieldset>
      </div>
    </div></section>
   </div>
  </section>
 </main>
</div>
<script>
const drawings={image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 16 5-5 4 4 3-3 6 6"/>',film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',users:'<circle cx="9" cy="7" r="4"/><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M17 3a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-4"/>',panel:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>',check:'<path d="m5 12 4 4L19 6"/>',loader:'<path d="M21 12a9 9 0 1 1-6-8.5"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${drawings[name]||drawings.image}</svg>`;
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const captions=['展示空间整体，缓慢推进至主体。','靠近主体，展示边框与材质细节。','切换角度，呈现自然光下的色彩。','展示主体与周围家具的搭配。','聚焦局部，保持画面稳定。','拉回全景，完整呈现空间效果。'];
let shots,active=0,kind='image',busy=false,timer,serial=0;
const newKind=()=>({results:[],selected:null,adopted:null,prompt:'以自然光展示空间与主体，画面简洁，保留真实材质。',model:'示例模型 A',ratio:'竖屏 9:16',count:'4',quality:'自动',amount:'1.00',reference:''});
const state=()=>shots[active][kind];
const typeName=()=>kind==='image'?'图片':'视频';
function placeholder(item,large=false){return `<div class="placeholder${large?' large':''}" data-variant="${item.number%4}">${icon(item.kind==='image'?'image':'film')}<span>${item.kind==='image'?'图片':'视频'}占位 ${String(item.number).padStart(2,'0')}</span>${large?`<span class="small">${escapeHTML(item.ratio)}${item.kind==='video'?' · 5 秒':''} · ${escapeHTML(item.model)}</span>`:''}</div>`}
function renderShots(){document.querySelector('#shots').innerHTML=shots.map((shot,i)=>{const adopted=shot.image.adopted||shot.video.adopted;const pending=shot.image.results.length+shot.video.results.length;return `<tr aria-selected="${i===active}"><td>S${String(i+1).padStart(2,'0')}</td><td><button class="shot-button" data-shot="${i}" ${busy?'disabled':''} aria-label="选择镜头 S${String(i+1).padStart(2,'0')}">${captions[i]}</button></td><td>5.0 s</td><td><span class="shot-status${adopted?' adopted':''}">${adopted?'已采用':pending?`${pending} 个待选`:'待准备'}</span></td></tr>`}).join('');document.querySelector('#matched').textContent=`${shots.filter(s=>s.image.adopted||s.video.adopted).length} / 6 画面就绪`}
function renderResults(message=''){
 const s=state(),selected=s.results.find(r=>r.id===s.selected),scrollTop=document.querySelector('.thumbnail-rail')?.scrollTop??0;
 document.querySelector('#result-count').textContent=`${s.results.length} 个`;
 document.querySelector('#result-hint').textContent=s.results.length?'左侧选择，右侧预览':'等待生成结果';
 const rail=s.results.length?`<div class="thumbnail-rail" aria-label="${typeName()}生成候选">${s.results.map(item=>`<button class="candidate" data-candidate="${item.id}" aria-label="预览${typeName()}候选 ${String(item.number).padStart(2,'0')}${item.id===s.adopted?'，已采用':''}" aria-pressed="${item.id===s.selected}" ${busy?'disabled':''}>${placeholder(item)}<div class="candidate-info"><span>${String(item.number).padStart(2,'0')}</span>${item.id===s.adopted?`${icon('check')}`:''}</div></button>`).join('')}</div>`:`<div class="rail-empty">${icon(kind==='image'?'image':'film')}<span>无结果</span></div>`;
 const preview=selected?`<section class="selection-preview" aria-label="候选预览">${placeholder(selected,true)}<div class="selection-footer"><p title="${escapeHTML(selected.model)}"><strong>候选 ${String(selected.number).padStart(2,'0')}</strong><span class="muted"> · ${escapeHTML(selected.model)}</span></p><button class="btn primary" id="adopt" ${busy||selected.id===s.adopted?'disabled':''}>${selected.id===s.adopted?'已采用':`采用此${typeName()}`}</button></div></section>`:`<div class="empty">${busy?`<div class="pending">${icon('loader')}正在生成占位结果…</div>`:icon(kind==='image'?'image':'film')}<strong>${s.results.length?'选择左侧缩略图预览':`尚未生成${typeName()}`}</strong><span>${s.results.length?'选中后可采用到当前镜头':'生成完成后，结果会显示在这里。'}</span></div>`;
 document.querySelector('#results-content').innerHTML=`<div class="results-gallery">${rail}<div class="preview-column">${preview}</div></div>`;
 if(document.querySelector('.thumbnail-rail'))document.querySelector('.thumbnail-rail').scrollTop=scrollTop;
 document.querySelector('#status').textContent=message||(busy?'正在生成占位结果…':'');
}
function render(){const s=state();renderShots();document.querySelector('#target').textContent=`S${String(active+1).padStart(2,'0')} · 画面`;document.querySelector('#prompt').value=s.prompt;document.querySelector('#prompt').previousSibling.textContent=`${typeName()}提示词`;document.querySelector('#model').value=s.model;document.querySelector('#ratio').value=s.ratio;document.querySelector('#count').value=s.count;for(const name of ['quality','amount','reference'])document.querySelector(`#${name}`).value=s[name];document.querySelector('#generate').textContent=busy?'正在生成…':`生成${typeName()}`;document.querySelector('#form').disabled=busy;document.querySelector('#generate').disabled=busy||!s.prompt.trim();document.querySelectorAll('[data-kind]').forEach(button=>{button.setAttribute('aria-selected',String(button.dataset.kind===kind));button.disabled=busy});document.querySelector('#generation-panel').setAttribute('aria-labelledby',`${kind}-tab`);renderResults()}
function generate(){const s=state();if(busy||!s.prompt.trim())return;busy=true;const count=Number(s.count),snapshot={model:s.model,ratio:s.ratio,kind};render();timer=setTimeout(()=>{const added=Array.from({length:count},()=>({...snapshot,id:`result-${++serial}`,number:serial}));s.results.unshift(...added);busy=false;render();renderResults(`新增 ${count} 个占位结果，请点选预览。`);const region=document.querySelector('#results');region.classList.remove('results-arrived');requestAnimationFrame(()=>region.classList.add('results-arrived'));document.querySelector('#results-title').focus({preventScroll:true});region.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})},800)}
function reset(){clearTimeout(timer);shots=captions.map(()=>({image:newKind(),video:newKind()}));active=0;kind='image';busy=false;serial=0;render()}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.dataset.shot!==undefined){active=Number(button.dataset.shot);render()}else if(button.dataset.kind){kind=button.dataset.kind;render()}else if(button.dataset.candidate){state().selected=button.dataset.candidate;renderResults();document.querySelector(`[data-candidate="${state().selected}"]`)?.focus({preventScroll:true})}else if(button.id==='generate')generate();else if(button.id==='adopt'){const s=state();s.adopted=s.selected;const other=shots[active][kind==='image'?'video':'image'];other.adopted=null;renderShots();renderResults(`已采用到镜头 S${String(active+1).padStart(2,'0')}。`);document.querySelector('#results-title').focus({preventScroll:true})}else if(button.id==='reset')reset()});
document.querySelector('#prompt').addEventListener('input',event=>{state().prompt=event.target.value;document.querySelector('#generate').disabled=!event.target.value.trim()});for(const name of ['model','ratio','count','quality','amount','reference'])document.querySelector(`#${name}`).addEventListener('change',event=>state()[name]=event.target.value);
document.querySelector('.kind-tabs').addEventListener('keydown',event=>{if(busy||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();kind=event.key==='Home'?'image':event.key==='End'?'video':kind==='image'?'video':'image';render();document.querySelector(`#${kind}-tab`).focus()});
document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon));reset();
</script>
</body>
