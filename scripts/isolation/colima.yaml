# Copy into the dedicated loop-stage-a profile, never the default profile.
cpu: 2
memory: 4
disk: 20
runtime: docker
vmType: vz
activate: false
sshConfig: false
portForwarder: none
docker:
  ip: 127.0.0.1
dns:
  - 1.1.1.1
  - 8.8.8.8
provision:
  - mode: system
    script: |
      if ! test -e /etc/resolv.conf; then
        mkdir -p /run/systemd/resolve
        printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /run/systemd/resolve/stub-resolv.conf
      fi
